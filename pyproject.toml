[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-cobra"
version = "0.1.0"
description = "COBRApy flux-balance analysis as process-bigraph components, with a Michaelis-Menten uptake process and a dynamic-FBA composite."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eran Agmon" }]
keywords = ["cobrapy", "flux-balance-analysis", "dynamic-fba", "process-bigraph", "vivarium", "metabolic-modeling"]

dependencies = [
    "cobra>=0.29",
    "process-bigraph>=1.8.3",
    "bigraph-schema>=0.0.50",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "pandas"]

[tool.setuptools]
# Bundled SBML GEMs ship with the package.
include-package-data = true

[tool.setuptools.packages.find]
include = ["viva_cobra*"]

[tool.setuptools.package-data]
viva_cobra = ["models/*.xml"]
